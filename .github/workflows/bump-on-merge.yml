name: Bump version on merge

# This repo consumes its own reusable bump-version.yml, the same way an
# external repo would — via a bump:<level> label on the merged PR. Uses a
# same-repo relative path rather than `owner/repo/...@v1`, since there's no
# reason to round-trip through a tag reference for a workflow that already
# lives right here.
#
# The npm-publish half lives here, not in bump-version.yml itself — that
# workflow is reusable and exported for other repos to call, most of which
# won't want npm publishing (or may not even be npm packages). Publishing
# is this repo's own concern, so it's a plain job in this repo-local file
# instead of an option baked into the shared workflow.
#
# This also used to be a separate release-cli.yml triggered by the tag
# push bump-version.yml makes. That never actually fired: GitHub doesn't
# let a push made with the default GITHUB_TOKEN trigger other workflows
# (an anti-recursion rule), so every merge silently tagged a version that
# was never published. Consuming bump-version.yml's tag output directly in
# a needs: job here sidesteps that entirely — nothing needs to react to an
# event that can't fire.

on:
  pull_request:
    types: [closed]
    branches: [master]

jobs:
  bump:
    if: github.event.pull_request.merged == true
    permissions:
      contents: write
    uses: ./.github/workflows/bump-version.yml
    with:
      branch: master
      package-dir: cli

  publish:
    needs: bump
    if: needs.bump.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        working-directory: cli
        run: |
          npm install
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Move major version tag
        run: |
          major_tag="v$(echo "${{ needs.bump.outputs.tag }}" | cut -d. -f1 | tr -d v)"
          git tag -f "$major_tag"
          git push -f origin "$major_tag"
