name: scan-secrets (reusable)

# Reusable workflow: scan for secrets via `@laarnicayetano/preflight-cli
# scan-secrets` (wraps gitleaks against configs/gitleaks.toml, or a config
# the consumer supplies).
#
# Consumers call this from their own workflow, e.g.:
#
#   on:
#     pull_request:
#   jobs:
#     scan-secrets:
#       uses: laarnicayetano/lumenis-repo-preflight/.github/workflows/scan-secrets.yml@v1
#       with:
#         config: .gitleaks.toml   # optional, defaults to .gitleaks.toml

on:
  workflow_call:
    inputs:
      config:
        description: "Path to gitleaks config, relative to the consuming repo root"
        type: string
        default: ".gitleaks.toml"

jobs:
  scan-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        uses: taiki-e/install-action@v2
        with:
          tool: gitleaks
      - run: npx @laarnicayetano/preflight-cli scan-secrets --config "${{ inputs.config }}"
