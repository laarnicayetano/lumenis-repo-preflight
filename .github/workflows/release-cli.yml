name: Release CLI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: latest
          registry-url: https://registry.npmjs.org

      - name: Install deps
        run: npm install
        working-directory: cli

      - name: Publish to npm
        run: npm publish --access restricted
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Re-point the moving major tag (e.g. v1) to this release so consumers
      # pinned to `@v1` in a workflow `uses:` line pick up the update.
      # Full guarantees for sensitive jobs should pin to a commit SHA instead.
      - name: Move major version tag
        run: |
          major_tag="v$(echo "${GITHUB_REF_NAME}" | cut -d. -f1 | tr -d v)"
          git tag -f "$major_tag"
          git push -f origin "$major_tag"
